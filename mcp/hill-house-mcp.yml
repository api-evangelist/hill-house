tools:
- name: search_catalog
  description: Search products from the online store using natural-language queries and/or filters (categories, price range); paginated via cursor.
- name: get_cart
  description: Get a cart by id, including items, shipping options, discount info, and checkout URL.
- name: update_cart
  description: Add/remove/update line items, buyer identity, delivery addresses, delivery options, discount and gift-card codes, and notes in one call; creates a cart when no cart_id is given.
- name: search_shop_policies_and_faqs
  description: Answer questions about store policies, products, or services (returns, shipping, hours, phone number).
- name: get_product_details
  description: Look up a product by id and select a specific variant via options; supports localized country/language.
