name: Hill House
description: >-
  Hill House Home is a digital-first lifestyle brand that brings beauty and joy to everyday
  rituals. Since launching with bedding in 2016 it has extended its collections to bath, baby,
  accessories and apparel, including the widely beloved Nap Dress. The direct-to-consumer
  storefront at hillhousehome.com runs on Shopify and exposes a live, public Storefront MCP
  server (catalog search, cart, and store-policy tools) at /api/mcp, plus Shopify Customer
  Account OAuth 2.0 / OpenID Connect discovery for customer-scoped access. Surfaced as an 8vc
  portfolio company and enriched from its public commerce surface.
